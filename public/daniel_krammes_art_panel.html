  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 52px 52px;
}

/* TOP */
.top {
  display: flex;
  justify-content: flex-end;
  opacity: 0;
  animation: fadeIn 1s 0.5s ease forwards;
}

.badge {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.badge-line {
  width: 1px;
  height: 56px;
  background: linear-gradient(to bottom, transparent, var(--gold));
  margin-left: auto;
  margin-bottom: 8px;
}

.badge-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 8.5px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(201,168,76,0.7);
  font-weight: 500;
}

/* CENTER QUOTE */
.center-quote {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  animation: fadeIn 1.2s 0.8s ease forwards;
  width: 70%;
}

.quote-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(18px, 2.2vw, 26px);
  font-style: italic;
  font-weight: 300;
  color: rgba(245,242,236,0.6);
  letter-spacing: 0.03em;
  line-height: 1.65;
}

.quote-open, .quote-close {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2em;
  color: var(--gold);
  line-height: 0;
  vertical-align: -0.4em;
}

.quote-open { margin-right: 4px; }
.quote-close { margin-left: 4px; }

/* BOTTOM */
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  opacity: 0;
  animation: fadeIn 1s 1s ease forwards;
}

.logo-block { display:flex;flex-direction:column;gap:12px; }

.logo-block img {
  height: 30px;
  filter: brightness(10);
  opacity: 0.88;
}

.logo-sub {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-sub::before {
  content: '';
  display: block;
  width: 28px;
  height: 1px;
  background: var(--gold);
}

.logo-sub span {
  font-family: 'Montserrat', sans-serif;
  font-size: 8.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(201,168,76,0.6);
  font-weight: 400;
}

.stats { display:flex;gap:36px;align-items:flex-end; }

.stat { display:flex;flex-direction:column;gap:4px;text-align:right; }

.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 300;
  color: var(--gold-light);
  line-height: 1;
}

.stat-lbl {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,242,236,0.32);
  font-weight: 400;
}

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
